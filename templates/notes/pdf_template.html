{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <link rel="stylesheet" href="{% static 'css/pdf-export.css' %}">
</head>
<body class="pdf-export-body">
    <div class="pdf-export-wrap">
        <div class="pdf-export-header">
            <h1>{{ note.title }}</h1>
            <p class="pdf-export-meta">
                {% if note.is_pinned %}Pinned note · {% endif %}
                Updated {{ note.updated_at|date:"F j, Y \a\t g:i a" }}
            </p>
        </div>

        {% if note.tags.all %}
            <div class="pdf-export-tags">
                {% for tag in note.tags.all %}
                    <span class="pdf-export-tag">{{ tag.name }}</span>
                {% endfor %}
            </div>
        {% endif %}

        <div class="pdf-export-content">{{ note.content|linebreaksbr }}</div>
    </div>
</body>
</html>
