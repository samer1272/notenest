{% extends 'base.html' %}

{% block title %}{{ page_title }} · NoteNest{% endblock %}

{% block content %}
<h1>{{ page_title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save note</button>
    <a href="{% if note %}{% url 'note_detail' note.pk %}{% else %}{% url 'home' %}{% endif %}">Cancel</a>
</form>
{% endblock %}
